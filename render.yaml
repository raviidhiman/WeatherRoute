# Render Blueprint (free plans). Deploy: Render dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: weatherroute-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # ONE worker with threads: rate limits and the weather cache live in process memory.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 8 --timeout 90 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.7 }
      - { key: DJANGO_DEBUG, value: "0" }
      - { key: DJANGO_SECRET_KEY, generateValue: true }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }   # set to the static site URL, e.g. https://weatherroute-web.onrender.com
      - { key: PROVIDER_USER_AGENT, sync: false }    # e.g. "WeatherRoute/1.0 (you@example.com)"
      # Optional AI advisor (OpenAI-compatible API). Leave unset to keep it off; the rule-based advisor needs nothing.
      - { key: AI_BASE_URL, sync: false }
      - { key: AI_MODEL, sync: false }
      - { key: AI_API_KEY, sync: false }
  - type: web
    name: weatherroute-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: X-Frame-Options, value: DENY }
      - { path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin }
      # Report-only first: confirm the map loads with no violations, then rename to Content-Security-Policy.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com https://tilecache.rainviewer.com; font-src 'self' data:; connect-src 'self' https://*.onrender.com https://api.rainviewer.com https://tilecache.rainviewer.com; worker-src 'self'; base-uri 'self'; form-action 'self'"
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: VITE_API_BASE_URL, sync: false }      # e.g. https://weatherroute-api.onrender.com
